<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InvoiceStudio · Arquivo</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#182c3c;font:15px system-ui}header{padding:25px 5%;background:#142f3b;color:white;display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;margin:0}small{color:#a9c9cf}main{max-width:1400px;margin:30px auto;padding:0 25px}section{background:white;padding:25px;border-radius:14px;margin:20px 0;border:1px solid #dde5e8}button,input,select{font:inherit;padding:11px;border:1px solid #bacbd0;border-radius:7px}button{background:#126c75;color:white;cursor:pointer}input,select{max-width:100%}.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.muted{color:#617780}.scroll{overflow:auto;max-height:65vh}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:12px;border-bottom:1px solid #e3e9ec;max-width:330px;overflow-wrap:anywhere}th{white-space:nowrap;min-width:120px;background:#f1f6f7;position:sticky;top:0}pre{white-space:pre-wrap;max-width:70vw;max-height:45vh;overflow:auto}a{color:#126c75}.hidden{display:none!important}#login{max-width:470px;margin:60px auto}#message{color:#994824}h2{margin-top:0}.badge{border:1px solid #668c96;border-radius:30px;padding:7px 12px}#pages{margin-top:18px}
</style><header><div><h1>InvoiceStudio · Arquivo</h1><small>Consulta dos dados preservados · outubro de 2026</small></div><span class="badge">Só leitura</span></header><main><p id="message" role="status"></p><section id="login"><h2>Aceder ao arquivo</h2><p class="muted">Introduz a senha de acesso ao arquivo.</p><form id="loginForm" class="bar"><input id="password" type="password" autocomplete="current-password" placeholder="Senha" aria-label="Senha" required><button>Entrar</button></form></section><div id="app" class="hidden"><section><div class="bar"><h2 style="margin:0;flex:1">Explorar arquivo</h2><button id="logout">Terminar sessão</button></div><p id="summary" class="muted"></p><div class="bar"><label>Consultar <select id="table"></select></label><label>Projeto <select id="project"><option value="">Todos</option></select></label><input id="search" type="search" placeholder="Pesquisar nos registos" aria-label="Pesquisar"><button id="find">Pesquisar</button><button id="files">Ficheiros originais</button></div><p class="muted">Os registos e os ficheiros são preservados para consulta. Não é possível editar ou emitir documentos.</p></section><section><h2 id="title">Documentos</h2><div id="results" class="scroll"></div><div id="pages" class="bar"><button id="prev">Anterior</button><span id="count"></span><button id="next">Seguinte</button></div></section></div></main><script>
const $=id=>document.getElementById(id);let page=0,total=0,mode='records';const labels={documents:'Documentos',customers:'Clientes',custom_proposals:'Propostas',document_lines:'Linhas dos documentos',proposal_lines:'Linhas das propostas',catalog_items:'Artigos do catálogo',calendar_events:'Calendário'};
async function api(url,opts){const r=await fetch(url,opts);const d=await r.json();if(!r.ok){if(r.status===401){$('app').classList.add('hidden');$('login').classList.remove('hidden')}throw Error(d.error||'Erro ao consultar arquivo')}return d}
function message(e){$('message').textContent=e?.message||''}function element(tag,text){const e=document.createElement(tag);e.textContent=text;return e}
async function init(){const d=await api('/api/overview');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('password').value='';$('table').replaceChildren();d.tables.forEach(t=>{const o=element('option',labels[t]||t);o.value=t;$('table').append(o)});$('table').value='documents';$('project').replaceChildren(new Option('Todos',''));d.projects.forEach(p=>$('project').append(new Option(`${p.project||'(sem projeto)'} · ${p.documents} documentos`,p.project||'')));$('summary').textContent=`${d.projects.length} projetos · ${d.projects.reduce((a,p)=>a+p.documents,0)} documentos · ${d.files[0].count} ficheiros preservados`;await load()}
async function load(){message();const q=$('search').value;const params=new URLSearchParams({table:$('table').value,project:$('project').value,q,page});const d=await api('/api/records?'+params);total=d.total;mode='records';$('pages').classList.remove('hidden');$('title').textContent=labels[$('table').value]||$('table').value;$('count').textContent=`${total} registos · página ${page+1}`;$('prev').disabled=page===0;$('next').disabled=(page+1)*50>=total;render(d.rows)}
function render(rows){const target=$('results');target.replaceChildren();if(!rows.length){target.textContent='Sem resultados.';return}const table=element('table',''),head=element('thead',''),tr=element('tr','');const preferred=['date','docNumber','docType','supplier','customer','total','status','name','proposal_number','client_ref','project_ref','project','vat','email'];const all=Object.keys(rows[0]);const keys=[...preferred.filter(k=>all.includes(k)),...all.filter(k=>!preferred.includes(k)&&!['rawJson','raw_data','metadata','branding_config'].includes(k))].slice(0,7);keys.push('Detalhes');keys.forEach(k=>tr.append(element('th',k)));head.append(tr);table.append(head);const body=element('tbody','');rows.forEach(row=>{const tr=element('tr','');keys.forEach(k=>{const td=element('td',''),v=k==='Detalhes'?row:row[k];if(v&&typeof v==='object'||String(v||'').length>180){const details=element('details','');details.append(element('summary','Ver conteúdo'),element('pre',typeof v==='object'?JSON.stringify(v,null,2):v));td.append(details)}else td.textContent=v??'—';tr.append(td)});body.append(tr)});table.append(body);target.append(table)}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});await init()}catch(e){message(e)}};
$('logout').onclick=async()=>{await api('/logout',{method:'POST'});location.reload()};$('find').onclick=()=>{page=0;load().catch(message)};$('table').onchange=$('project').onchange=$('find').onclick;$('prev').onclick=()=>{page--;load().catch(message)};$('next').onclick=()=>{page++;load().catch(message)};$('search').onkeydown=e=>{if(e.key==='Enter')$('find').click()};
$('files').onclick=async()=>{try{const rows=await api('/api/files?'+new URLSearchParams({q:$('search').value}));$('title').textContent='Ficheiros originais';$('pages').classList.add('hidden');$('results').replaceChildren();rows.forEach(r=>{const p=element('p','');const a=element('a',r.path);a.href='/file?'+new URLSearchParams({path:r.path});a.target='_blank';a.rel='noopener';p.append(a,element('span',` · ${(r.bytes/1024).toFixed(1)} KB`));$('results').append(p)});if(!rows.length)$('results').textContent='Sem ficheiros para esta pesquisa.'}catch(e){message(e)}};init().catch(e=>{if(!e.message.includes('Inicia sessão'))message(e)});
</script></html>
